<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="image/icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Magic Clicker</title>
</head>

<body>

    <header>
        <section>
            <a href="../../index.html">Accueil</a>
            <h1>Magic Clicker</h1>
        </section>
    </header>

    <main>
        <article>
            <h2>Statistiques :</h2>
            <section class="stat">
                <div class="elixir">
                    <h3>Elixir : </h3><span id="compteur">0</span>
                </div>
                <div>
                    <h3>Revenu : </h3><span id="offline">0</span> / sec
                </div>
                <div>
                    <h3>Revenu : </h3><span id="perclick">1</span> / click
                </div>
            </section>
        </article>
        <img id="button" src="image/centre.png"></img>
        <article>
            <h2>Magasin :</h2>
            <section class="shop">
                <button id="amélioration">Boost click + 0.5 | Prix <span id='price'>10</span></button>
                <button id="amelio-offline">Revenu auto + 0.5 | Prix <span id="price-offline">20</span></button>
                <button id="amelio-GrosBoost">Boost click + 1 | Prix <span id="price-GrosBoost">40</span></button>
                <button id="amelio-offline-GrosBoost">Revenu auto + 1 | Prix <span
                        id="price-offline-GrosBoost">80</span></button>
            </section>
        </article>
    </main>

    <footer>

    </footer>

</body>

</html>
